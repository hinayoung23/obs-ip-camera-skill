[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-ip-camera-skill"
version = "1.0.0"
description = "Connect generic IP camera streams to OBS Virtual Camera on macOS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "hinayoung23" },
]
keywords = ["obs", "ip-camera", "rtsp", "virtual-camera", "macos", "skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
obs-ip-camera = "obs_ip_camera:main"

[project.urls]
Homepage = "https://github.com/hinayoung23/obs-ip-camera-skill"
Repository = "https://github.com/hinayoung23/obs-ip-camera-skill"
Issues = "https://github.com/hinayoung23/obs-ip-camera-skill/issues"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"obs_ip_camera.py" = "obs_ip_camera.py"
